// Quick Dogfight, Arena 5

void init_bases()
{

  base_anz = 0;
}

void init_spobjects()
{
  int nr;

  spobject[0].type = GRAVTRAP;
  spobject[0].xpos = 440; spobject[0].ypos = 360;
  spobject[0].startframe = 0; spobject[0].maxframe = 0; spobject[0].maxframet = 10; spobject[0].maxhit = 5000;
  spobject[0].image.data = -1;
  spobject[0].image.width = 1; spobject[0].image.height = 1;
  spobject[0].powr = 30;
  spobject[0].active = TRUE;

  // 10 extras
  for (nr=1; nr < 11; nr++)
  {
    spobject[nr].type = EXTRA1;
    spobject[nr].xpos = 0; spobject[nr].ypos = 0;
    spobject[nr].startframe = 0; spobject[nr].maxframe = 2; spobject[nr].maxframet = 5;
    spobject[nr].image.data = obj_extra1_1;
    spobject[nr].image.width = 11; spobject[nr].image.height = 11;
    spobject[nr].active = FALSE;
  }

  spobject_anz = 11;
}

void init_objects()
{

  object_anz = 0;
}

void init_enemies()
{

  enemy_anz = 0;
}

void init_paths()
{

  node_anz = 0;
}
